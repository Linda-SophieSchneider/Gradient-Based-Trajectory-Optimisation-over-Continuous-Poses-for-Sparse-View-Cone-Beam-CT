# Photon-noise half of tab:ornl_runs (sec:results_noisefree). Single fluence
# level I0 = 1e5, the one level shared by both pre-registered fluence pairs,
# and the same five selector families as the noise-free table so the two
# halves are row-matched.
name: noise_i0_1e5_flange_384
description: "Photon-noise robustness: continuous vs noise-blind VCLS (Defrise flange)"
experiment_type: noise_robustness
output: experiments/results/lof_plate_20260825/noise_i0_1e5_flange_384.csv

phantom:
  type: milp_npy
  path: data/lof_flange_v3.npy
  resolution: 384

geometry: milp
sart_iterations: 15
k_max: 720
voxel_subsample_r1: 0.001
seed: 0
selection_seeds: [0, 1, 2]
paired_baseline: vcls
force_rebuild_cache: true

photon_levels: [1.0e5]
noise_seeds: [0, 1, 2, 3, 4]
k_values: [40, 80]

methods:
  - name: vcls
  - name: greedy_discrete
  - name: greedy_adam_bundle
    kwargs: {bundle_n_samples: 256, bundle_clip_to_volume: true}
  - name: greedy_adam_vcl
  - name: greedy_adam_composite
    kwargs: {bundle_n_samples: 256, bundle_clip_to_volume: true}
