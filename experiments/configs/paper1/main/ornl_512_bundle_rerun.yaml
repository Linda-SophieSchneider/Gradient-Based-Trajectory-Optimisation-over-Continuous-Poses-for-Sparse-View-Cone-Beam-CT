# Partial rerun: only bundle methods, after lambda_vcl fix (0.2 -> 0.0).
# Unchanged methods (vcls_circle, vcls, vcls_adam_vcl, greedy_adam_vcl)
# are NOT rerun — use existing ornl_512.csv for those.

name: ornl_512_bundle_rerun
description: "Bundle-only rerun after lambda_vcl=0.0 fix"
experiment_type: method_grid
output: experiments/results/ornl_512_bundle_rerun.csv

phantom:
  type: ornl_nozzle
  path: data/ornl_nozzle.h5
  section: L
  resolution: 512

geometry: ornl
sart_iterations: 15
k_max: 720
voxel_subsample_r1: 0.001
seed: 0
metrics: [psnr, ssim, nrmse, hfen]

k_values: [40, 80]

methods:
  - name: vcls_adam_bundle_center
  - name: vcls_adam_bundle
  - name: greedy_adam_bundle_center
  - name: greedy_adam_bundle
