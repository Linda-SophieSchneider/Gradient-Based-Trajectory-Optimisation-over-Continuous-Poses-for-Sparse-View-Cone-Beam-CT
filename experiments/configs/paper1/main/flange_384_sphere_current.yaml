# Sphere-based selectors on the Defrise flange, same recipe as
# ornl_512_sphere_current.yaml, so the two objects can share one table.
name: flange_384_sphere_current
description: "Defrise flange sphere selectors, current protocol, cold start"
experiment_type: method_grid
output: experiments/results/lof_plate_20260825/flange_384_sphere_current.csv

phantom:
  type: milp_npy
  path: data/lof_flange_v3.npy
  resolution: 384

geometry: milp
sart_iterations: 15
k_max: 720
voxel_subsample_r1: 0.001
seed: 0
metrics: [psnr, ssim, nrmse, hfen]

k_values: [40, 80]

methods:
  - name: vcls                    # discrete anchor
  - name: greedy_adam_vcl         # cov + VCL, cold
  - name: greedy_adam_bundle      # cov + bundle, cold
    kwargs: {bundle_n_samples: 256, bundle_clip_to_volume: true}
  - name: greedy_adam_composite   # cov + VCL + bundle, cold, the paper's arm
    kwargs: {bundle_n_samples: 256, bundle_clip_to_volume: true}
