# Reproduces Table V (Cold-start learning-rate sweep).  greedy_tuy init
# plus continuous VCL on MILP-mild 192^3 at k = 40.  Shows that no
# learning rate brings the cold-start basin into the VCLS basin: source
# displacement grows from 3 to 138 mm with lr, but distance to the VCLS
# basin stays at ~133 mm and PSNR degrades.

name: ablation_lr_cold_lof_v4a
description: "Table V — cold-start LR sweep, MILP mild 192^3 k=40"
experiment_type: param_sweep
output: experiments/results/basin_v4a_20260829/ablation_lr_cold_lof_v4a.csv

phantom:
  type: milp_npy
  path: data/lof_flange_v4a.npy
  resolution: 384

geometry: milp
sart_iterations: 15
k_max: 720
voxel_subsample_r1: 0.001
seed: 0
metrics: [psnr, ssim, nrmse, hfen]

k_values: [40]

methods:
  - name: greedy_adam_vcl_cold
    base_kwargs:
      lambda_cov: 1.0
      lambda_vcl: 0.2
      lambda_path: 0.0
      init_method: greedy_tuy
      n_steps: 100

sweep:
  param: lr
  values: [0.05, 0.5, 2.0, 5.0]
