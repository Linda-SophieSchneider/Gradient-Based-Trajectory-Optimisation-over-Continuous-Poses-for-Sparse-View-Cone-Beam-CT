# Reproduces Table V (Cold-start learning-rate sweep).  greedy_tuy init
# plus continuous VCL on MILP-mild 192^3 at k = 40.  Shows that no
# learning rate brings the cold-start basin into the VCLS basin: source
# displacement grows from 3 to 138 mm with lr, but distance to the VCLS
# basin stays at ~133 mm and PSNR degrades.

name: lr_scale_diagnosis_lof_v3
description: "Step-size diagnosis: direct (mm) parametrisation needs lr ~ sid*lr_ang; sweep to 50 mm"
experiment_type: param_sweep
output: experiments/results/lof_plate_20260825/lr_scale_diagnosis_lof_v3.csv

phantom:
  type: milp_npy
  path: data/lof_flange_v3.npy
  resolution: 384

geometry: milp
sart_iterations: 15
k_max: 720
voxel_subsample_r1: 0.001
seed: 0
metrics: [psnr, ssim, nrmse, hfen]

k_values: [40, 80]

methods:
  - name: greedy_adam_vcl_cold
    base_kwargs:
      lambda_cov: 1.0
      lambda_vcl: 0.2
      lambda_path: 0.0
      init_method: greedy_tuy
      n_steps: 100

sweep:
  param: lr
  values: [0.05, 0.5, 2.0, 5.0, 10.0, 25.0, 50.0]
